[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ggassembler"
version = "0.1.0"
description = "GG Assembler - design Golden Gate assemblies in the Yeast Toolkit (YTK) standard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Stefan Zdraljevic", email = "szdralje@g.ucla.edu" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "biopython>=1.83",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ggasm = "ggassembler.cli:main"

[tool.hatch.build.targets.wheel]
# `packages` already carries everything under ggassembler/, web/ included.
# A force-include of web/ on top of it offered the same files twice and the
# build refused: "a second file is being added at the same path".
packages = ["ggassembler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]
