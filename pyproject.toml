[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggassembler"
version = "0.1.0"
description = "GG Assembler - design Golden Gate assemblies in the Yeast Toolkit (YTK) standard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "biopython>=1.83",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ggasm = "ggassembler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ggassembler"]

[tool.hatch.build.targets.wheel.force-include]
"ggassembler/web" = "ggassembler/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]
